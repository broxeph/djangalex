{% load static django_bootstrap5 %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Alex Ball</title>

    <link rel="shortcut icon" type="image/png" href="{% static 'home/favicon.ico' %}"/>
    {% bootstrap_css %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'home/home.css' %}">

    <link rel="stylesheet" href="https://use.typekit.net/ljz3uhu.css">

    {% include 'analytics.html' %}
</head>
<body>
<div class="container content">
    <div class="row header">
        <div class="col-sm-4">
            <img src="{% static 'home/headshot.jpg' %}" class="headshot">
        </div>
        <div class="col-sm-8">
            <h1 class="title">Alex Ball</h1>
            <h3 class="subtitle">Full-StackOverflow Developer</h3>
            <p class="quote">{{ subtitle }}</p>
            <p class="email">
                <a href="mailto:alex+web@ball.lol"><i class="bi bi-envelope"></i>alex@ball.lol</a>
            </p>
        </div>
    </div>
    <div class="boxes">
        {% for box in boxes %}
        <div class="box">
            <a href="{{ box.link_url }}">
                <img src="{% static box.logo_url_static %}">
            </a>
        </div>
        {% endfor %}
    </div>
    <div class="footnote">
        Background photo credit: Alex Ball
    </div>
</div>
</body>
</html>
