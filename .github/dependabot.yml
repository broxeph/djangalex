version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python-dependencies:
        patterns: ["*"]
    ignore:
      # Stay on the Django 5.2 LTS line; major/minor moves are deliberate.
      - dependency-name: Django
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
