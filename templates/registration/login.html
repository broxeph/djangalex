{% extends 'wineapp/base.html' %}
{% load django_bootstrap5 %}

{% block content %}
<h1>Login</h1>
<form action="{% url 'login' %}" method="post" class="row row-cols-lg-auto g-3 align-items-center">
    {% csrf_token %}
    {% bootstrap_form form layout='inline' %}
    <div class="col-12">
        <button type="submit" class="btn btn-primary">
            <i class="bi bi-person"></i> Login
        </button>
    </div>
</form>
{% endblock %}
