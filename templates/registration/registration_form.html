{% extends 'wineapp/base.html' %}
{% load django_bootstrap5 %}

{% block content %}
<h1>Register!</h1>
<form method="post">
    {% csrf_token %}
    {% bootstrap_form form %}
    <button type="submit" class="btn btn-primary">
        <i class="bi bi-person"></i> Register
    </button>
</form>
{% endblock %}
